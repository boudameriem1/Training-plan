<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Meriem's Training Plan 2027</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ─── RESET & BASE ─────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:        #ffffff;
  --bg2:       #f7f8fc;
  --bg3:       #eef0f7;
  --border:    rgba(0,0,0,0.08);
  --border2:   rgba(0,0,0,0.14);
  --text:      #1a1d2e;
  --muted:     #8a90a8;
  --muted2:    #5a6078;

  --run:       #00b86b;
  --run-bg:    #e6faf2;
  --run-dim:   #b3f0d6;
  --bike:      #1a8fff;
  --bike-bg:   #e6f3ff;
  --bike-dim:  #b3d8ff;
  --swim:      #7c5cfc;
  --swim-bg:   #ede8ff;
  --swim-dim:  #c8b8ff;
  --gym:       #f0900a;
  --gym-bg:    #fff3e0;
  --gym-dim:   #ffd49e;
  --brick:     #f0500a;
  --brick-bg:  #fff0eb;
  --brick-dim: #ffbda0;
  --race:      #e8003a;
  --race-bg:   #ffebf0;
  --rest-bg:   #f9f9fb;

  --radius:    8px;
  --radius-lg: 14px;
}

html { scroll-behavior: smooth; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.5;
}



/* ─── HEADER ────────────────────────────────────────────── */
.header {
  position: relative;
  padding: 60px 40px 48px;
  border-bottom: 1px solid var(--border);
  overflow: hidden;
  background: linear-gradient(135deg, #f0f8ff 0%, #f7f0ff 50%, #f0fff8 100%);
}
.header::before {
  content: '';
  position: absolute;
  top: -80px; right: -80px;
  width: 400px; height: 400px;
  background: radial-gradient(circle, rgba(26,143,255,0.15) 0%, transparent 65%);
  pointer-events: none;
}
.header::after {
  content: '';
  position: absolute;
  bottom: -60px; left: 200px;
  width: 300px; height: 300px;
  background: radial-gradient(circle, rgba(0,184,107,0.12) 0%, transparent 65%);
  pointer-events: none;
}
.header-inner { position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; }
.header-eyebrow {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.18em;
  color: var(--bike);
  text-transform: uppercase;
  margin-bottom: 12px;
}
.header h1 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(48px, 7vw, 88px);
  line-height: 0.95;
  letter-spacing: 0.02em;
  color: var(--text);
  margin-bottom: 18px;
}
.header h1 span { color: var(--run); }
.header-sub {
  font-size: 15px;
  color: var(--muted2);
  max-width: 520px;
  line-height: 1.6;
  margin-bottom: 32px;
}
.header-stats {
  display: flex;
  gap: 32px;
  flex-wrap: wrap;
}
.stat {
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.stat-val {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 28px;
  letter-spacing: 0.04em;
  line-height: 1;
}
.stat-label {
  font-size: 11px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-family: 'DM Mono', monospace;
}
.stat:nth-child(1) .stat-val { color: var(--muted2); }
.stat:nth-child(2) .stat-val { color: var(--run); }
.stat:nth-child(3) .stat-val { color: var(--gym); }
.stat:nth-child(4) .stat-val { color: var(--race); }
.stat:nth-child(5) .stat-val { color: var(--bike); }
.stat:nth-child(6) .stat-val { color: var(--swim); }
.stat:nth-child(7) .stat-val { color: var(--muted2); }

/* ─── PROGRESS BAR ─────────────────────────────────────── */
.progress-bar-wrap {
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 16px 40px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 12px rgba(0,0,0,0.06);
}
.progress-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; gap: 16px; }
.progress-label { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); white-space: nowrap; }
.progress-track {
  flex: 1;
  height: 6px;
  background: var(--bg3);
  border-radius: 99px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--run), var(--bike), var(--swim));
  border-radius: 99px;
  transition: width 0.4s ease;
  width: 0%;
}
.progress-pct { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--muted2); min-width: 36px; text-align: right; }

/* ─── LEGEND ────────────────────────────────────────────── */
.legend-bar {
  padding: 14px 40px;
  border-bottom: 1px solid var(--border);
  background: var(--bg2);
}
.legend-inner {
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
  align-items: center;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 12px;
  color: var(--muted2);
}
.legend-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
}
.legend-sep { width: 1px; height: 16px; background: var(--border); margin: 0 4px; }

/* ─── MAIN LAYOUT ──────────────────────────────────────── */
.main { max-width: 1200px; margin: 0 auto; padding: 40px 40px 80px; }

/* ─── PHASE ─────────────────────────────────────────────── */
.phase {
  margin-bottom: 60px;
  opacity: 0;
  transform: translateY(20px);
  transition: opacity 0.5s ease, transform 0.5s ease;
}
.phase.visible { opacity: 1; transform: none; }

/* collapsed phase hides all weeks */
.phase.collapsed .phase-weeks { display: none; }
.phase.collapsed .phase-header { margin-bottom: 0; border-bottom-color: transparent; }
.phase.collapsed { margin-bottom: 20px; }

/* completed phase gets a subtle green accent on the header */
.phase.phase-done .phase-header {
  background: linear-gradient(90deg, #f0fff8 0%, transparent 60%);
  border-radius: var(--radius-lg);
  padding: 12px 16px;
  margin-bottom: 12px;
  border-bottom: 1px solid var(--run-dim);
}
.phase.phase-done.collapsed .phase-header {
  border-bottom-color: var(--run-dim);
  margin-bottom: 0;
}

.phase-header {
  display: flex;
  align-items: flex-start;
  gap: 20px;
  margin-bottom: 24px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  user-select: none;
  transition: background 0.2s, border-radius 0.2s;
  border-radius: var(--radius-lg);
  padding: 12px 16px;
  margin-left: -16px;
  margin-right: -16px;
}
.phase-header:hover { background: var(--bg2); }

.phase-chevron {
  display: flex;
  align-items: center;
  justify-content: center;
  margin-left: auto;
  color: var(--muted);
  transition: transform 0.25s ease;
  flex-shrink: 0;
  padding-top: 18px;
}
.phase.collapsed .phase-chevron { transform: rotate(-90deg); }
.phase-num {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 64px;
  line-height: 1;
  color: #dde0ee;
  min-width: 52px;
  user-select: none;
}
.phase-info { flex: 1; }
.phase-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 32px;
  letter-spacing: 0.04em;
  color: var(--text);
  line-height: 1.1;
  margin-bottom: 6px;
}
.phase-dates {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 0.1em;
  margin-bottom: 10px;
}
.phase-structure {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 10px;
}
.ps-pill {
  font-size: 11px;
  font-weight: 500;
  padding: 3px 10px;
  border-radius: 99px;
  border: 1px solid;
}
.ps-run  { color: var(--run);   border-color: var(--run-dim);   background: var(--run-bg); }
.ps-bike { color: var(--bike);  border-color: var(--bike-dim);  background: var(--bike-bg); }
.ps-swim { color: var(--swim);  border-color: var(--swim-dim);  background: var(--swim-bg); }
.ps-gym  { color: var(--gym);   border-color: var(--gym-dim);   background: var(--gym-bg); }
.phase-progress {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 6px;
  min-width: 120px;
}
.phase-pct-ring {
  position: relative;
  width: 56px; height: 56px;
}
.phase-pct-ring svg { transform: rotate(-90deg); }
.phase-pct-ring circle { fill: none; stroke-width: 3; }
.ring-bg { stroke: var(--bg3); }
.ring-fill { stroke-dasharray: 157; stroke-dashoffset: 157; transition: stroke-dashoffset 0.8s ease; stroke-linecap: round; }
.phase-pct-text {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  font-weight: 500;
  color: var(--muted2);
}
.phase-weeks-count {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: var(--muted);
  text-align: center;
}
.phase-skip-pct {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: var(--gym);
  text-align: center;
  margin-top: 3px;
  font-weight: 500;
}

/* ─── WEEK ──────────────────────────────────────────────── */
.week {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  margin-bottom: 10px;
  overflow: hidden;
  transition: border-color 0.2s, box-shadow 0.2s;
  box-shadow: 0 1px 4px rgba(0,0,0,0.04);
}
.week:hover { border-color: var(--border2); box-shadow: 0 2px 12px rgba(0,0,0,0.07); }
.week.completed { border-color: var(--run-dim); background: var(--run-bg); }
.week.completed .week-header { background: transparent; }

.week-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 18px;
  cursor: pointer;
  user-select: none;
  transition: background 0.15s;
}
.week-header:hover { background: var(--bg2); }

.week-check {
  width: 20px; height: 20px;
  border: 1.5px solid var(--border2);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.2s;
  cursor: pointer;
  background: transparent;
}
.week-check:hover { border-color: var(--run); }
.week.completed .week-check {
  background: var(--run);
  border-color: var(--run);
}
.week-check svg { display: none; }
.week.completed .week-check svg { display: block; }

.week-num {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: var(--muted);
  min-width: 38px;
  letter-spacing: 0.06em;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.week-daterange {
  font-size: 9px;
  color: var(--muted);
  letter-spacing: 0.04em;
  font-weight: 400;
  white-space: nowrap;
}
.week-title {
  font-size: 14px;
  font-weight: 500;
  color: var(--text);
  flex: 1;
}
.week.completed .week-title { color: var(--muted2); text-decoration: line-through; text-decoration-color: var(--muted); }

.day-date {
  font-size: 9px;
  color: var(--muted);
  font-weight: 400;
  letter-spacing: 0.04em;
  opacity: 0.8;
}

.week-tags { display: flex; gap: 5px; flex-shrink: 0; }
.wtag {
  font-size: 10px;
  font-weight: 500;
  padding: 2px 7px;
  border-radius: 99px;
}
.wtag-run  { background: var(--run-bg);   color: var(--run);  }
.wtag-bike { background: var(--bike-bg);  color: var(--bike); }
.wtag-swim { background: var(--swim-bg);  color: var(--swim); }
.wtag-gym  { background: var(--gym-bg);   color: var(--gym);  }
.wtag-race { background: var(--race-bg);  color: var(--race); }
.wtag-rest { background: var(--rest-bg);  color: var(--muted);}

.week-chevron {
  color: var(--muted);
  transition: transform 0.25s;
  flex-shrink: 0;
}
.week.open .week-chevron { transform: rotate(180deg); }

.week-body { display: none; padding: 0 18px 18px; background: var(--bg); }
.week.open .week-body { display: block; }

/* ─── DAY GRID ──────────────────────────────────────────── */
.day-grid {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 5px;
  margin-bottom: 14px;
  align-items: start;
}

.day-cell {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 7px 7px 8px;
  position: relative;
  transition: border-color 0.2s, background 0.2s;
  overflow: hidden;
  word-break: break-word;
  min-height: 0;
}
.day-cell.rest { opacity: 0.45; }
.day-cell.day-done { background: var(--run-bg); border-color: var(--run-dim); }
.day-cell.day-done .day-check { background: var(--run); border-color: var(--run); }
.day-cell.day-done .day-check svg { display: block; }

/* skipped state */
.day-cell.day-skipped { background: #fff8f0; border-color: #ffd0a0; }
.day-cell.day-skipped .day-content,
.day-cell.day-skipped .day-type { opacity: 0.45; text-decoration: line-through; text-decoration-color: rgba(0,0,0,0.2); }
.day-cell.day-skipped .day-skip { background: var(--gym); border-color: var(--gym); }
.day-cell.day-skipped .day-skip svg { display: block; }
.day-cell.day-skipped .skip-label { opacity: 1; }
.skip-label {
  font-size: 8px;
  font-weight: 600;
  color: var(--gym);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  opacity: 0;
  transition: opacity 0.15s;
}
.day-cell.day-skipped .skip-label { opacity: 1; }

.day-checks {
  display: flex;
  align-items: center;
  gap: 4px;
}
.day-skip {
  width: 14px; height: 14px;
  border: 1.5px solid var(--border2);
  border-radius: 3px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.15s;
  background: transparent;
  flex-shrink: 0;
  font-size: 8px;
  line-height: 1;
  color: transparent;
}
.day-skip svg { display: none; width: 8px; height: 8px; }
.day-skip:hover { border-color: var(--gym); background: var(--gym-bg); }

.day-name {
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.1em;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.day-block { margin-bottom: 4px; }
.day-block:last-child { margin-bottom: 0; }
.day-block + .day-block {
  padding-top: 4px;
  border-top: 1px solid var(--border);
}

.day-check {
  width: 14px; height: 14px;
  border: 1.5px solid var(--border2);
  border-radius: 3px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.15s;
  background: transparent;
  flex-shrink: 0;
}
.day-check svg { display: none; width: 8px; height: 8px; }
.day-check:hover { border-color: var(--run); }

.day-badge {
  font-size: 9px;
  font-weight: 600;
  padding: 1px 5px;
  border-radius: 3px;
  display: inline-block;
  margin-bottom: 3px;
  letter-spacing: 0.06em;
}
.badge-gym   { background: var(--gym-bg);   color: var(--gym);   border: 1px solid var(--gym-dim); }
.badge-double{ background: var(--swim-bg);  color: var(--swim);  border: 1px solid var(--swim-dim);}
.badge-race  { background: var(--race-bg);  color: var(--race);  border: 1px solid rgba(239,68,68,0.3); }
.badge-brick { background: var(--brick-bg); color: var(--brick); border: 1px solid var(--brick-dim);}
.badge-coach { background: #f0e8ff; color: #6b21a8; border: 1px solid #d8b4fe; }
.badge-club  { background: #e0f2fe; color: #0369a1; border: 1px solid #7dd3fc; }

.day-type {
  font-size: 9.5px;
  font-weight: 600;
  margin-bottom: 2px;
  letter-spacing: 0.02em;
  overflow-wrap: break-word;
}
.dt-run   { color: var(--run); }
.dt-bike  { color: var(--bike); }
.dt-swim  { color: var(--swim); }
.dt-gym   { color: var(--gym); }
.dt-brick { color: var(--brick); }
.dt-race  { color: var(--race); }
.dt-rest  { color: var(--muted); }

.day-content {
  font-size: 10px;
  color: var(--muted2);
  line-height: 1.45;
  overflow-wrap: break-word;
  word-break: break-word;
}


/* ─── SCROLLBAR ─────────────────────────────────────────── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg2); }
::-webkit-scrollbar-thumb { background: var(--bg3); border-radius: 99px; }

/* ─── RESPONSIVE ────────────────────────────────────────── */
@media (max-width: 900px) {
  .day-grid { grid-template-columns: repeat(4, 1fr); }
  .header, .main, .progress-bar-wrap, .legend-bar { padding-left: 20px; padding-right: 20px; }
}
@media (max-width: 600px) {
  .day-grid { grid-template-columns: repeat(2, 1fr); }
  .header-stats { gap: 20px; }
  .phase-header { flex-wrap: wrap; }
}

/* ─── DAY NOTE ───────────────────────────────────────────── */
.day-note-wrap {
  margin-top: 5px;
  border-top: 1px dashed var(--border2);
  padding-top: 5px;
}
.day-note-label {
  font-size: 8px;
  font-weight: 600;
  color: var(--muted);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 3px;
}
.day-note-textarea {
  width: 100%;
  height: 64px;
  font-family: 'DM Sans', sans-serif;
  font-size: 10px;
  color: var(--text);
  background: #fffef5;
  border: 1px solid #e8e4c0;
  border-radius: 5px;
  padding: 4px 6px;
  resize: none;
  line-height: 1.45;
  transition: border-color 0.15s, background 0.15s;
  outline: none;
  box-sizing: border-box;
  overflow-y: auto;
}
.day-note-textarea:focus {
  border-color: var(--swim);
  background: #fff;
  box-shadow: 0 0 0 2px rgba(124,92,252,0.1);
}
.day-note-textarea::placeholder { color: var(--muted); font-style: italic; }
.day-note-save {
  margin-top: 4px;
  font-size: 10px;
  font-weight: 500;
  color: var(--swim);
  background: transparent;
  border: none;
  cursor: pointer;
  padding: 0;
  letter-spacing: 0.02em;
  transition: color 0.15s;
}
.day-note-save:hover { color: var(--bike); }
.day-note-saved-indicator {
  font-size: 9px;
  color: var(--run);
  margin-top: 3px;
  display: none;
}

/* ─── FLOATING RESET ─────────────────────────────────────── */
.reset-btn {
  position: fixed;
  bottom: 24px; right: 24px;
  background: #fff;
  border: 1.5px solid var(--border2);
  color: var(--muted2);
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  padding: 8px 14px;
  border-radius: 99px;
  cursor: pointer;
  transition: all 0.2s;
  z-index: 200;
  letter-spacing: 0.06em;
  box-shadow: 0 2px 12px rgba(0,0,0,0.08);
}
.reset-btn:hover { background: var(--bg2); color: var(--text); border-color: var(--muted); }

/* ─── ANIMATION ──────────────────────────────────────────── */
@keyframes fadeUp {
  from { opacity:0; transform: translateY(16px); }
  to   { opacity:1; transform: none; }
}

/* ===== Today's Fuel buttons + modal ===== */
.fuel-btn{
  margin-top:8px;display:inline-flex;align-items:center;gap:4px;
  padding:3px 8px;border:1px solid #e3b7a0;border-radius:6px;background:#fff6f0;
  color:#b2460f;font-family:'DM Sans',system-ui,sans-serif;font-size:.66rem;font-weight:600;
  cursor:pointer;letter-spacing:.01em;transition:background .15s,border-color .15s;align-self:flex-start;
}
.fuel-btn:hover{background:#fdeadf;border-color:#d79a7d;}
.mm-na{color:#15803d;font-weight:700;}
.mm-tag{background:#e7f3ec;color:#15803d;border-radius:8px;padding:7px 12px;font-size:.78rem;font-weight:600;}
.shop-bar{margin:2px 0 12px;}
.shop-btn{
  display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border:1px solid #e0ded6;border-radius:7px;
  background:transparent;color:#6b6e76;font-family:'DM Sans',system-ui,sans-serif;font-size:.7rem;font-weight:600;
  cursor:pointer;transition:background .15s,border-color .15s,color .15s;
}
.shop-btn:hover{background:#f4f3ef;color:#16181d;border-color:#cfcdc4;}

#meal-modal-root{display:none;}
#meal-modal-root.open{display:block;}
.mm-overlay{position:fixed;inset:0;background:rgba(20,22,28,.55);display:flex;align-items:flex-start;
  justify-content:center;padding:36px 16px;z-index:9999;overflow-y:auto;backdrop-filter:blur(2px);}
.mm-card{background:#fff;width:100%;max-width:660px;border-radius:18px;padding:22px 24px 26px;
  box-shadow:0 24px 60px rgba(0,0,0,.28);animation:mmIn .18s ease;}
@keyframes mmIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.mm-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;min-height:30px;}
.mm-eyebrow{font-family:'DM Sans',sans-serif;font-weight:700;font-size:.95rem;color:#16181d;letter-spacing:.01em;}
.mm-x{background:none;border:none;font-size:1.5rem;line-height:1;color:#9aa0a8;cursor:pointer;padding:2px 6px;border-radius:6px;}
.mm-x:hover{color:#16181d;background:#f1f1ee;}
.mm-back{background:none;border:none;font-family:'DM Sans',sans-serif;font-size:.85rem;font-weight:600;color:#b2460f;cursor:pointer;padding:4px 6px;border-radius:6px;}
.mm-back:hover{background:#fdeadf;}
.mm-slot{font-family:'DM Sans',sans-serif;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#b2460f;margin-bottom:2px;}
.mm-title{font-family:'DM Sans',sans-serif;font-size:1.4rem;font-weight:700;color:#16181d;margin:0 0 14px;}
.mm-meals{display:flex;flex-direction:column;gap:11px;}
.mm-meal{display:grid;grid-template-columns:1fr auto;grid-template-areas:"slot go" "name go" "mac go";
  gap:2px 10px;align-items:center;text-align:left;width:100%;padding:14px 16px;border:1px solid #e7e5dd;
  border-radius:13px;background:#fcfbf8;cursor:pointer;transition:border-color .15s,background .15s,transform .1s;}
.mm-meal:hover{border-color:#d79a7d;background:#fff6f0;transform:translateY(-1px);}
.mm-meal-slot{grid-area:slot;font-family:'DM Sans',sans-serif;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#b2460f;}
.mm-meal-name{grid-area:name;font-family:'DM Sans',sans-serif;font-size:1.05rem;font-weight:700;color:#16181d;}
.mm-meal-mac{grid-area:mac;font-size:.82rem;color:#6b6e76;}
.mm-meal-go{grid-area:go;font-size:.82rem;font-weight:600;color:#b2460f;white-space:nowrap;}
.mm-macros{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
.mm-macros span{background:#f4f3ef;border-radius:8px;padding:7px 12px;font-size:.82rem;color:#4a4d54;}
.mm-macros b{color:#16181d;font-size:.92rem;}
.mm-cols{display:grid;grid-template-columns:1fr 1.2fr;gap:22px;}
.mm-cols h4{font-family:'DM Sans',sans-serif;font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#9aa0a8;margin:0 0 9px;}
.mm-ing{list-style:none;margin:0;padding:0;}
.mm-ing li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid #f0efe9;font-size:.9rem;color:#2d2f35;}
.mm-ing li:last-child{border-bottom:none;}
.mm-q{color:#6b6e76;font-variant-numeric:tabular-nums;white-space:nowrap;}
.mm-steps{margin:0;padding-left:18px;}
.mm-steps li{padding:4px 0 4px 2px;font-size:.9rem;color:#2d2f35;line-height:1.45;}
.mm-foot{margin-top:16px;font-size:.82rem;color:#6b6e76;line-height:1.5;background:#f8f7f3;border-radius:10px;padding:11px 13px;}
.mm-shop{display:grid;grid-template-columns:1fr 1fr;gap:10px 24px;margin-top:12px;}
.mm-shop-cat h4{font-family:'DM Sans',sans-serif;font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#9aa0a8;margin:8px 0 6px;}
.mm-shop-cat ul{list-style:none;margin:0 0 8px;padding:0;}
.mm-shop-cat li{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid #f0efe9;font-size:.88rem;color:#2d2f35;}
@media (max-width:600px){
  .mm-cols{grid-template-columns:1fr;gap:16px;}
  .mm-shop{grid-template-columns:1fr;}
  .mm-card{padding:18px 16px 22px;}
}

/*__MEAS_CSS_START__*/
/* ===== Weekly measurements: button, tracker chart, modal form ===== */
.measure-btn{margin-top:8px;display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border:1px solid #bcd3e0;
  border-radius:6px;background:#eef6fb;color:#1d6a8f;font-family:'DM Sans',system-ui,sans-serif;font-size:.66rem;
  font-weight:600;cursor:pointer;align-self:flex-start;transition:background .15s,border-color .15s;}
.measure-btn:hover{background:#e0eff8;border-color:#9cbfd2;}
.measure-tracker{max-width:1120px;margin:20px auto 0;padding:0 24px;box-sizing:border-box;}
.track-card{background:#fff;border:1px solid #e7e5dd;border-radius:14px;padding:16px 18px;}
.track-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:8px;}
.track-title{font-family:'DM Sans',sans-serif;font-weight:700;font-size:.95rem;color:#16181d;}
.track-legend{display:flex;gap:14px;font-size:.78rem;color:#6b6e76;flex-wrap:wrap;}
.track-legend span{display:inline-flex;align-items:center;gap:5px;}
.track-legend i{width:11px;height:11px;border-radius:3px;display:inline-block;}
.track-svg{width:100%;height:auto;display:block;}
.track-svg .axl{font-family:'DM Sans',sans-serif;font-size:11px;fill:#9aa0a8;}
.track-read{margin-top:8px;font-size:.84rem;color:#6b6e76;}
.track-read b{color:#16181d;}
.track-empty{max-width:1120px;margin:0 auto;color:#6b6e76;font-size:.9rem;background:#fff;border:1px dashed #d8d5cc;
  border-radius:12px;padding:16px 18px;text-align:center;}
.meas-card{max-width:440px;}
.meas-form{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:4px 0 18px;}
.meas-field{display:flex;flex-direction:column;gap:5px;font-family:'DM Sans',sans-serif;font-size:.8rem;color:#4a4d54;font-weight:600;}
.meas-field i{color:#9aa0a8;font-style:normal;font-weight:500;}
.meas-field input{font-size:1rem;padding:9px 11px;border:1px solid #e0ded6;border-radius:9px;font-family:inherit;color:#16181d;width:100%;box-sizing:border-box;}
.meas-field input:focus{outline:none;border-color:#1d6a8f;}
.meas-actions{display:flex;align-items:center;justify-content:flex-end;gap:10px;}
.meas-save{background:#1d6a8f;color:#fff;border:none;border-radius:9px;padding:9px 20px;font-family:'DM Sans',sans-serif;font-weight:600;font-size:.85rem;cursor:pointer;}
.meas-save:hover{background:#185a79;}
.meas-del{background:none;border:none;color:#b24a4a;font-family:'DM Sans',sans-serif;font-weight:600;font-size:.82rem;cursor:pointer;padding:9px 10px;margin-right:auto;}
.meas-del:hover{text-decoration:underline;}
@media(max-width:600px){.meas-form{grid-template-columns:1fr;}}

/*__MEAS_CSS_END__*/
/*__IPAD_CSS_START__*/
html{-webkit-text-size-adjust:100%;}
body{overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent;}
button,input,select,a,label,.day{touch-action:manipulation;}
.tool-dock{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));right:calc(16px + env(safe-area-inset-right));z-index:200;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:72vw;}
.tool-dock .reset-btn{position:static;bottom:auto;right:auto;}
@media (pointer:coarse){.fuel-btn,.shop-btn,.measure-btn{padding:6px 12px;font-size:.74rem;}.mm-x{font-size:1.8rem;padding:4px 10px;}.meas-save{min-height:44px;}}
/*__IPAD_CSS_END__*/

function getMeasAll(){var s=getState();return s.meas||{};}
function _measRoot(){return document.getElementById('measure-modal-root');}
function closeMeasure(){var r=_measRoot();if(r){r.innerHTML='';r.classList.remove('open');}}
function _numv(id){var el=document.getElementById(id);if(!el||el.value==='')return null;var n=parseFloat(el.value);return isNaN(n)?null:n;}
function openMeasure(wk){
 var all=getMeasAll();var d=all[wk]||{};
 function fld(id,label,unit,val,step){return '<label class="meas-field"><span>'+label+' <i>'+unit+'</i></span><input id="'+id+'" type="number" step="'+step+'" inputmode="decimal" value="'+(val!=null?val:'')+'" placeholder="—"></label>';}
 var body='<div class="mm-head"><div class="mm-eyebrow">📏 Weekly measurements · Week '+wk+'</div><button class="mm-x" onclick="closeMeasure()">×</button></div>'
  +'<div class="meas-form">'
  +fld('meas-w','Weight','kg',d.w,'0.1')
  +fld('meas-f','Body fat','%',d.f,'0.1')
  +fld('meas-m','Muscle','%',d.m,'0.1')
  +fld('meas-waist','Waist','cm',d.waist,'0.5')
  +'</div>'
  +'<div class="meas-actions">'+(Object.keys(d).length?'<button class="meas-del" onclick="deleteMeasure('+wk+')">Delete</button>':'')+'<button class="meas-save" onclick="submitMeasure('+wk+')">Save</button></div>';
 var r=_measRoot();r.innerHTML='<div class="mm-overlay" onclick="if(event.target===this)closeMeasure()"><div class="mm-card meas-card">'+body+'</div></div>';r.classList.add('open');
}
function submitMeasure(wk){
 var o={w:_numv('meas-w'),f:_numv('meas-f'),m:_numv('meas-m'),waist:_numv('meas-waist')};
 var clean={};Object.keys(o).forEach(function(k){if(o[k]!=null)clean[k]=o[k];});
 var s=getState();s.meas=s.meas||{};
 if(Object.keys(clean).length)s.meas[wk]=clean; else delete s.meas[wk];
 setState(s);closeMeasure();renderTracker();
}
function deleteMeasure(wk){var s=getState();if(s.meas){delete s.meas[wk];setState(s);}closeMeasure();renderTracker();}
function renderTracker(){
 var host=document.getElementById('measure-tracker');if(!host)return;
 var all=getMeasAll();
 var weeks=Object.keys(all).map(Number).filter(function(w){return all[w]&&all[w].w!=null;}).sort(function(a,b){return a-b;});
 if(weeks.length===0){host.innerHTML='<div class="track-empty">📈 Your weight, fat mass &amp; muscle mass will chart here. Tap “Weekly measurements” on any Sunday to log your first entry.</div>';return;}
 var Sw=[],Sfm=[],Smm=[];
 weeks.forEach(function(wk){var d=all[wk];var w=d.w;Sw.push({x:wk,y:w});if(d.f!=null)Sfm.push({x:wk,y:Math.round(w*d.f/100*10)/10});if(d.m!=null)Smm.push({x:wk,y:Math.round(w*d.m/100*10)/10});});
 var W=800,H=240,padL=46,padR=16,padT=18,padB=34;
 var xmin=weeks[0],xmax=weeks[weeks.length-1];if(xmax===xmin)xmax=xmin+1;
 var allY=Sw.concat(Sfm,Smm).map(function(p){return p.y;});
 var ymin=Math.min.apply(null,allY),ymax=Math.max.apply(null,allY);
 var gap=(ymax-ymin)*0.15||2;ymin=Math.floor(ymin-gap);ymax=Math.ceil(ymax+gap);if(ymin<0)ymin=0;
 function X(x){return padL+(x-xmin)/(xmax-xmin)*(W-padL-padR);}
 function Y(y){return padT+(ymax-y)/(ymax-ymin)*(H-padT-padB);}
 function series(arr,color){if(!arr.length)return '';var d=arr.map(function(p,i){return (i?'L':'M')+X(p.x).toFixed(1)+' '+Y(p.y).toFixed(1);}).join(' ');var dots=arr.map(function(p){return '<circle cx="'+X(p.x).toFixed(1)+'" cy="'+Y(p.y).toFixed(1)+'" r="3.2" fill="'+color+'"/>';}).join('');return '<path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+dots;}
 var grid='';for(var i=0;i<=4;i++){var yy=ymin+(ymax-ymin)*i/4;var py=Y(yy);grid+='<line x1="'+padL+'" y1="'+py.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+py.toFixed(1)+'" stroke="#eee8dd" stroke-width="1"/><text x="'+(padL-8)+'" y="'+(py+3).toFixed(1)+'" text-anchor="end" class="axl">'+yy.toFixed(0)+'</text>';}
 var xlab='';var xticks=[xmin,Math.round((xmin+xmax)/2),xmax].filter(function(v,ix,a){return a.indexOf(v)===ix;});
 xticks.forEach(function(xx){xlab+='<text x="'+X(xx).toFixed(1)+'" y="'+(H-12)+'" text-anchor="middle" class="axl">W'+xx+'</text>';});
 var cW='#2d2f35',cF='#d08324',cM='#1f8a5b';
 var svg='<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet" class="track-svg">'+grid+series(Sw,cW)+series(Sfm,cF)+series(Smm,cM)+xlab+'<text x="12" y="'+(padT+4)+'" class="axl" transform="rotate(-90 12 '+(H/2)+')" text-anchor="middle">kg</text></svg>';
 var last=all[weeks[weeks.length-1]];
 var read='<div class="track-read">Latest (W'+weeks[weeks.length-1]+'): <b>'+last.w+'</b> kg'+(last.f!=null?' · <b>'+last.f+'%</b> fat':'')+(last.m!=null?' · <b>'+last.m+'%</b> muscle':'')+'</div>';
 var legend='<div class="track-legend"><span><i style="background:'+cW+'"></i>Weight</span><span><i style="background:'+cF+'"></i>Fat mass</span><span><i style="background:'+cM+'"></i>Muscle mass</span></div>';
 host.innerHTML='<div class="track-card"><div class="track-head"><span class="track-title">📈 Body composition</span>'+legend+'</div>'+svg+read+'</div>';
}

function importData(){var inp=document.createElement('input');inp.type='file';inp.accept='application/json,.json';inp.onchange=function(){var f=inp.files&&inp.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var obj=JSON.parse(r.result);localStorage.setItem(STORAGE_KEY,JSON.stringify(obj));location.reload();}catch(e){alert('Restore failed: that file is not a valid backup.');}};r.readAsText(f);};inp.click();}

// ─── BUILD UI ────────────────────────────────────────────
const STORAGE_KEY = 'lean_plan_v7';

function getState() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch(e) { return {}; }
}
function setState(s) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); } catch(e) {}
}

function sessionId(phaseIdx, weekIdx, dayIdx, blockIdx) {
  return `p${phaseIdx}_w${weekIdx}_d${dayIdx}_b${blockIdx}`;
}
function skipId(phaseIdx, weekIdx, dayIdx) {
  return `p${phaseIdx}_w${weekIdx}_d${dayIdx}_skip`;
}
function weekId(phaseIdx, weekIdx) {
  return `p${phaseIdx}_w${weekIdx}`;
}

let totalSessions = 0;

function countNonRestSessions(days) {
  let n = 0;
  days.forEach(day => {
    day.blocks.forEach(b => {
      if (b.t !== 'dt-rest') n++;
    });
  });
  return n;
}

// ─── DATE HELPERS ────────────────────────────────────────
// Week 1 Monday = 12 May 2026
// Week 1 Monday = 16 Nov 2026 — change this one line to re-date the whole plan
const PLAN_START = new Date(2026, 10, 16); // Nov 16 2026 (month is 0-indexed)

function addDays(date, n) {
  const d = new Date(date);
  d.setDate(d.getDate() + n);
  return d;
}
function fmtShort(date) {
  // e.g. "11.05"
  const d = String(date.getDate()).padStart(2,'0');
  const m = String(date.getMonth()+1).padStart(2,'0');
  return `${d}.${m}`;
}
function fmtMedium(date) {
  // e.g. "11 May"
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${date.getDate()} ${months[date.getMonth()]}`;
}
function weekStartDate(weekIndex) {
  // weekIndex is 0-based across all phases
  return addDays(PLAN_START, weekIndex * 7);
}

// ─── GYM LABEL HELPER ────────────────────────────────────
function gymLabel(type, content) {
  const t = (type + ' ' + content).toLowerCase();
  // combined / full body signals
  if (t.includes('combined') || t.includes('full body') || t.includes('1 session') || t.includes('full lower') && t.includes('upper')) return 'Strength — Full Body';
  // lower body signals
  if (t.includes('lower') || t.includes('squat') || t.includes('rdl') || t.includes('glute') || t.includes('split squat') || t.includes('bulgarian') || t.includes('hip thrust') || t.includes('calf') || t.includes('step-up') || t.includes('bw circuit') || t.includes('bw squats')) {
    // but check if upper body exercises are also present = combined
    const hasUpper = t.includes('row') || t.includes('pulldown') || t.includes('shoulder press') || t.includes('face pull') || t.includes('ext. rotation');
    if (hasUpper) return 'Strength — Full Body';
    return 'Strength — Lower Body';
  }
  // upper body signals
  if (t.includes('upper') || t.includes('swim upper') || t.includes('row') || t.includes('pulldown') || t.includes('shoulder press') || t.includes('face pull') || t.includes('ext. rotation')) return 'Strength — Upper Body';
  // maintenance / prehab only
  if (t.includes('maintenance') || t.includes('prehab') || t.includes('light')) return 'Strength — Maintenance';
  return 'Strength';
}

function buildUI() {
  const container = document.getElementById('main-content');
  const state = getState();
  let globalWeekNum = 0;

  PHASES.forEach((phase, pi) => {
    const phaseEl = document.createElement('section');
    phaseEl.className = 'phase';
    phaseEl.id = `phase-${pi}`;

    const header = document.createElement('div');
    header.className = 'phase-header';

    const numEl = document.createElement('div');
    numEl.className = 'phase-num';
    numEl.textContent = phase.num;

    const info = document.createElement('div');
    info.className = 'phase-info';

    // compute phase start/end dates dynamically from globalWeekNum
    const phaseStartWkIdx = globalWeekNum; // 0-based index of first week of this phase
    const phaseEndWkIdx = globalWeekNum + phase.weeks.length - 1;
    const phaseStartDate = weekStartDate(phaseStartWkIdx);
    const phaseEndDate = addDays(weekStartDate(phaseEndWkIdx), 6);
    const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const phaseDateStr = `${MONTHS[phaseStartDate.getMonth()]} ${phaseStartDate.getFullYear()} → ${MONTHS[phaseEndDate.getMonth()]} ${phaseEndDate.getFullYear()}`;

    info.innerHTML = `
      <div class="phase-title">${phase.title}</div>
      <div class="phase-dates">${phaseDateStr}</div>
      <div class="phase-structure">
        ${phase.structure.map((s,i) => `<span class="ps-pill ps-${phase.structureTypes[i]}">${s}</span>`).join('')}
      </div>
    `;

    const progressWrap = document.createElement('div');
    progressWrap.className = 'phase-progress';
    progressWrap.innerHTML = `
      <div class="phase-pct-ring" id="ring-${pi}">
        <svg width="56" height="56" viewBox="0 0 56 56">
          <circle class="ring-bg" cx="28" cy="28" r="25"/>
          <circle class="ring-fill" cx="28" cy="28" r="25" stroke="${phase.ringColor}" id="ring-fill-${pi}" style="stroke-dashoffset:157"/>
        </svg>
        <div class="phase-pct-text" id="ring-text-${pi}">0%</div>
      </div>
      <div class="phase-weeks-count">${phase.weeks.length} weeks</div>
      <div class="phase-skip-pct" id="skip-pct-${pi}" style="display:none"></div>
    `;

    // add chevron to header
    const chevEl = document.createElement('div');
    chevEl.className = 'phase-chevron';
    chevEl.innerHTML = `<svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M4.5 6.75L9 11.25L13.5 6.75" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

    header.appendChild(numEl);
    header.appendChild(info);
    header.appendChild(progressWrap);
    header.appendChild(chevEl);
    header.addEventListener('click', () => togglePhaseOpen(pi));
    phaseEl.appendChild(header);

    // wrap all weeks in a collapsible container
    const weeksContainer = document.createElement('div');
    weeksContainer.className = 'phase-weeks';

    phase.weeks.forEach((week, wi) => {
      globalWeekNum++;
      const weekStart = weekStartDate(globalWeekNum - 1); // 0-based index
      const weekEnd = addDays(weekStart, 6);
      const wid = weekId(pi, wi);
      const weekEl = document.createElement('div');
      weekEl.className = 'week';
      weekEl.id = `week-${pi}-${wi}`;

      const wHeader = document.createElement('div');
      wHeader.className = 'week-header';

      const checkBtn = document.createElement('div');
      checkBtn.className = 'week-check';
      checkBtn.innerHTML = `<svg viewBox="0 0 10 8" fill="none"><path d="M1 4l2.5 2.5L9 1" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
      checkBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleWeek(pi, wi); });

      const wNum = document.createElement('div');
      wNum.className = 'week-num';
      wNum.innerHTML = `Wk ${globalWeekNum}<span class="week-daterange">${fmtShort(weekStart)} – ${fmtShort(weekEnd)}</span>`;

      const wTitle = document.createElement('div');
      wTitle.className = 'week-title';
      wTitle.textContent = week.title;

      const wTags = document.createElement('div');
      wTags.className = 'week-tags';
      wTags.innerHTML = week.tags.map(t => `<span class="wtag wtag-${t}">${t}</span>`).join('');

      const chev = document.createElement('div');
      chev.className = 'week-chevron';
      chev.innerHTML = `<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3 5l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

      wHeader.appendChild(checkBtn);
      wHeader.appendChild(wNum);
      wHeader.appendChild(wTitle);
      wHeader.appendChild(wTags);
      wHeader.appendChild(chev);
      wHeader.addEventListener('click', () => toggleWeekOpen(pi, wi));

      const wBody = document.createElement('div');
      wBody.className = 'week-body';

      const dayGrid = document.createElement('div');
      dayGrid.className = 'day-grid';

      week.days.forEach((day, di) => {
        const dayDate = addDays(weekStart, di);
        const dayCell = document.createElement('div');
        dayCell.className = 'day-cell' + (day.rest ? ' rest' : '');
        if (day.dbl) dayCell.classList.add('dbl');

        let nameHTML = `<div class="day-name"><span>${day.d} <span class="day-date">${fmtShort(dayDate)}</span></span>`;
        const hasCheckable = day.blocks.some(b => b.t !== 'dt-rest');
        if (hasCheckable) {
          const sid = sessionId(pi, wi, di, 0);
          nameHTML += `<div class="day-checks">
            <div class="day-check" title="Done" data-sid="${sid}" onclick="toggleDay(event,'${pi}','${wi}','${di}')"><svg viewBox="0 0 8 6" fill="none"><path d="M1 3l2 2 4-4" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
            <div class="day-skip" title="Skipped" onclick="toggleSkip(event,'${pi}','${wi}','${di}')"><svg viewBox="0 0 8 8" fill="none"><path d="M1.5 1.5l5 5M6.5 1.5l-5 5" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/></svg></div>
          </div>`;
        }
        nameHTML += '</div>';
        dayCell.innerHTML = nameHTML;

        if (day.dbl) {
          const badge = document.createElement('div');
          badge.className = 'day-badge badge-double';
          badge.textContent = 'DOUBLE';
          dayCell.appendChild(badge);
        }

        day.blocks.forEach((block, bi) => {
          const blockDiv = document.createElement('div');
          blockDiv.className = 'day-block';

          let badgeHTML = '';
          if (block.gym) badgeHTML = `<div class="day-badge badge-gym">HOME</div>`;
          if (block.race) badgeHTML = `<div class="day-badge badge-race">RACE</div>`;
          if (block.brick) badgeHTML = `<div class="day-badge badge-brick">BRICK</div>`;
          if (block.coach) badgeHTML += `<div class="day-badge badge-coach">COACH</div>`;

          blockDiv.innerHTML = `
            ${badgeHTML}
            <div class="day-type ${block.t}">${block.gym ? gymLabel(block.type, block.c) : block.type}</div>
            <div class="day-content">${block.c.replace(/\n/g,'<br>')}</div>
          `;
          dayCell.appendChild(blockDiv);
          if (block.t !== 'dt-rest') totalSessions++;
        });

        // Today's Fuel button (every day)
        (function(){
          var gdi=(globalWeekNum-1)*7+di;
          var fb=document.createElement('button');
          fb.className='fuel-btn';
          fb.innerHTML="\u{1F374} Today\u2019s Fuel";
          fb.addEventListener('click',function(e){e.stopPropagation();openFuel(gdi);});
          dayCell.appendChild(fb);
        })();

        // Weekly measurements button (Sundays)
        if(di===6){
          (function(){
            var gwk=globalWeekNum;
            var mb=document.createElement('button');
            mb.className='measure-btn';
            mb.innerHTML="\u{1F4CF} Weekly measurements";
            mb.addEventListener('click',function(e){e.stopPropagation();openMeasure(gwk);});
            dayCell.appendChild(mb);
          })();
        }

        // note section — only on non-rest days
        if (day.blocks.some(b => b.t !== 'dt-rest')) {
          const noteKey = `note_p${pi}_w${wi}_d${di}`;
          const savedNote = (() => { try { return getState()[noteKey] || ''; } catch(e) { return ''; } })();

          const noteWrap = document.createElement('div');
          noteWrap.className = 'day-note-wrap';

          const noteLabel = document.createElement('div');
          noteLabel.className = 'day-note-label';
          noteLabel.textContent = 'Notes';

          const textarea = document.createElement('textarea');
          textarea.className = 'day-note-textarea';
          textarea.placeholder = 'Training Recap';
          textarea.value = savedNote;

          const saveBtn = document.createElement('button');
          saveBtn.className = 'day-note-save';
          saveBtn.textContent = 'Save';
          saveBtn.style.display = 'none';

          const savedInd = document.createElement('div');
          savedInd.className = 'day-note-saved-indicator';
          savedInd.textContent = '✓ Saved';

          textarea.addEventListener('input', () => {
            saveBtn.style.display = 'block';
            savedInd.style.display = 'none';
          });

          const doSave = (e) => {
            if (e) e.stopPropagation();
            const s = getState();
            s[noteKey] = textarea.value;
            setState(s);
            saveBtn.style.display = 'none';
            savedInd.style.display = 'block';
            setTimeout(() => { savedInd.style.display = 'none'; }, 2000);
          };

          saveBtn.addEventListener('click', doSave);
          textarea.addEventListener('blur', doSave);
          textarea.addEventListener('click', e => e.stopPropagation());

          noteWrap.appendChild(noteLabel);
          noteWrap.appendChild(textarea);
          noteWrap.appendChild(saveBtn);
          noteWrap.appendChild(savedInd);
          dayCell.appendChild(noteWrap);
        }

        dayGrid.appendChild(dayCell);
      });

      (function(){
        var gwi=globalWeekNum-1;
        var bar=document.createElement('div'); bar.className='shop-bar';
        var sb=document.createElement('button'); sb.className='shop-btn';
        sb.innerHTML="\u{1F6D2} Weekly shopping list";
        sb.addEventListener('click',function(e){e.stopPropagation();openShopping(gwi);});
        bar.appendChild(sb); wBody.appendChild(bar);
      })();
      wBody.appendChild(dayGrid);


      weekEl.appendChild(wHeader);
      weekEl.appendChild(wBody);
      weeksContainer.appendChild(weekEl);
    });

    phaseEl.appendChild(weeksContainer);
    container.appendChild(phaseEl);
  });

  document.getElementById('total-sessions').textContent = totalSessions;
  applyState();
  observePhases();
  try{renderTracker();}catch(_e){}
}

function togglePhaseOpen(pi) {
  const phaseEl = document.getElementById(`phase-${pi}`);
  const isCollapsed = phaseEl.classList.toggle('collapsed');
  // persist in state
  const state = getState();
  state[`phase_collapsed_${pi}`] = isCollapsed;
  setState(state);
}

function toggleWeekOpen(pi, wi) {
  const weekEl = document.getElementById(`week-${pi}-${wi}`);
  weekEl.classList.toggle('open');
}

function toggleDay(e, pi, wi, di) {
  e.stopPropagation();
  const state = getState();
  const sid = sessionId(pi, wi, di, 0);
  const ski = skipId(pi, wi, di);
  state[sid] = !state[sid];
  if (state[sid]) state[ski] = false; // done clears skip
  setState(state);
  applyState();
}

function toggleSkip(e, pi, wi, di) {
  e.stopPropagation();
  const state = getState();
  const sid = sessionId(pi, wi, di, 0);
  const ski = skipId(pi, wi, di);
  state[ski] = !state[ski];
  if (state[ski]) state[sid] = false; // skip clears done
  setState(state);
  applyState();
}

function toggleWeek(pi, wi) {
  const state = getState();
  const week = PHASES[pi].weeks[wi];
  const allDone = week.days.every((day, di) => {
    if (!day.blocks.some(b => b.t !== 'dt-rest')) return true;
    return state[sessionId(pi, wi, di, 0)] || state[skipId(pi, wi, di)];
  });
  week.days.forEach((day, di) => {
    if (day.blocks.some(b => b.t !== 'dt-rest')) {
      if (allDone) {
        // untick everything
        state[sessionId(pi, wi, di, 0)] = false;
        state[skipId(pi, wi, di)] = false;
      } else {
        // mark done, clear skip
        state[sessionId(pi, wi, di, 0)] = true;
        state[skipId(pi, wi, di)] = false;
      }
    }
  });
  setState(state);
  applyState();
}

function applyState() {
  const state = getState();
  let done = 0, skipped = 0, weeksComplete = 0;
  let phasesDone = 0;

  PHASES.forEach((phase, pi) => {
    let phaseDone = 0, phaseTotal = 0, phaseSkipped = 0;
    let allWeeksComplete = true;

    phase.weeks.forEach((week, wi) => {
      const weekEl = document.getElementById(`week-${pi}-${wi}`);
      if (!weekEl) return;

      let weekDone = 0, weekTotal = 0;
      week.days.forEach((day, di) => {
        const dayCell = weekEl.querySelectorAll('.day-cell')[di];
        const hasCheckable = day.blocks.some(b => b.t !== 'dt-rest');
        if (!hasCheckable) return;

        const sid = sessionId(pi, wi, di, 0);
        const ski = skipId(pi, wi, di);
        const isDone = !!state[sid];
        const isSkipped = !!state[ski];
        weekTotal++;
        phaseTotal++;
        if (isDone) { weekDone++; phaseDone++; done++; }
        if (isSkipped) { weekDone++; skipped++; phaseSkipped++; } // skipped counts as handled for week completion

        if (dayCell) {
          dayCell.classList.toggle('day-done', isDone);
          dayCell.classList.toggle('day-skipped', isSkipped);

          // done checkbox
          const checkEl = dayCell.querySelector('.day-check');
          if (checkEl) {
            checkEl.style.background = isDone ? 'var(--run)' : 'transparent';
            checkEl.style.borderColor = isDone ? 'var(--run)' : 'rgba(0,0,0,0.14)';
            const svg = checkEl.querySelector('svg');
            if (svg) svg.style.display = isDone ? 'block' : 'none';
          }

          // skip checkbox
          const skipEl = dayCell.querySelector('.day-skip');
          if (skipEl) {
            skipEl.style.background = isSkipped ? 'var(--gym)' : 'transparent';
            skipEl.style.borderColor = isSkipped ? 'var(--gym)' : 'rgba(0,0,0,0.14)';
            const skipSvg = skipEl.querySelector('svg');
            if (skipSvg) skipSvg.style.display = isSkipped ? 'block' : 'none';
          }
        }
      });

      const isWeekComplete = weekTotal > 0 && weekDone === weekTotal;
      if (!isWeekComplete && weekTotal > 0) allWeeksComplete = false;
      if (isWeekComplete && weekTotal > 0) weeksComplete++;
      weekEl.classList.toggle('completed', isWeekComplete);
    });

    const phasePct = phaseTotal > 0 ? Math.round(phaseDone / phaseTotal * 100) : 0;
    const phaseSkippedPct = phaseTotal > 0 ? Math.round(phaseSkipped / phaseTotal * 100) : 0;
    if (phasePct === 100 && phaseTotal > 0) phasesDone++;

    const phaseEl = document.getElementById(`phase-${pi}`);
    if (phaseEl) {
      phaseEl.classList.toggle('phase-done', phasePct === 100 && phaseTotal > 0);
      const isCollapsed = !!state[`phase_collapsed_${pi}`];
      phaseEl.classList.toggle('collapsed', isCollapsed);
    }

    const ringFill = document.getElementById(`ring-fill-${pi}`);
    const ringText = document.getElementById(`ring-text-${pi}`);
    const skipPctEl = document.getElementById(`skip-pct-${pi}`);
    if (ringFill) ringFill.style.strokeDashoffset = 157 - (157 * phasePct / 100);
    if (ringText) ringText.textContent = phasePct + '%';
    if (skipPctEl) {
      skipPctEl.textContent = phaseSkippedPct + '% skipped';
      skipPctEl.style.display = phaseSkipped > 0 ? 'block' : 'none';
    }
  });

  const pct = totalSessions > 0 ? Math.round(done / totalSessions * 100) : 0;
  const fill = document.getElementById('main-progress-fill');
  const pctEl = document.getElementById('main-progress-pct');
  if (fill) fill.style.width = pct + '%';
  if (pctEl) pctEl.textContent = pct + '%';

  document.getElementById('done-sessions').textContent = done;
  document.getElementById('skipped-sessions').textContent = skipped;
  document.getElementById('done-weeks').textContent = weeksComplete;
  document.getElementById('done-pct').textContent = pct + '%';
  document.getElementById('phases-done').textContent = phasesDone + '/' + PHASES.length;
}

function resetAll() {
  if (confirm('Reset all progress? This cannot be undone.')) {
    localStorage.removeItem(STORAGE_KEY);
    applyState();
  }
}

function observePhases() {
  const obs = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target); }
    });
  }, { threshold: 0.05 });
  document.querySelectorAll('.phase').forEach(p => obs.observe(p));
}

buildUI();
</script>
